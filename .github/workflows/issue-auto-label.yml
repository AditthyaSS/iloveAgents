name: Auto Label New Issues

# Trigger: fires whenever a new issue is opened
on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest

    steps:
      - name: Apply OSIC'26 label to new issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const targetLabel = "OSIC'26";

            // Ensure the label exists in the repository before applying
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: targetLabel,
              });
            } catch {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: targetLabel,
                  color: '0075ca',
                  description: "Open Source Initiative Contributor '26",
                });
              } catch (err) {
                console.log('Notice: label creation skipped or exists:', err.message);
              }
            }

            // Set the issue labels to only OSIC'26
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [targetLabel],
            });

            console.log(`Successfully assigned only "${targetLabel}" to issue #${issueNumber}`);
