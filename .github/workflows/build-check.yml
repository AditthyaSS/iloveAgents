
name: Build Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: 22

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Check for broken registry imports
      - name: Check Registry Imports
        run: |
          if grep -rnE "import agents from ['\"].*agents/registry" src/; then
            echo "Broken default import of registry detected!"
            echo "Use the correct useAgents() hook instead."
            exit 1
          fi

          echo "Registry import check passed."

      # Run production build
      - name: Run Build
        run: npm run build

      # Comment on pull request failure
      - name: Comment on Build Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Build failed on this PR.**

              Please fix the errors before merging:

              1. Run \`npm ci\` locally.
              2. Run \`npm run build\`.
              3. Fix the errors shown.
              4. Push your changes.

              The build check will run automatically again.

              Common issue: incorrect agents registry imports.

              See CONTRIBUTING.md for help. 🙏`
            });

