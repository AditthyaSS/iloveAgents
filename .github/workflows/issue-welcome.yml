
name: Welcome New Issue Author

# Trigger whenever a new issue is opened
on:
  issues:
    types: [opened]

# Allow the workflow to post issue comments
permissions:
  issues: write

jobs:
  welcome:
    name: Welcome New Contributor
    runs-on: ubuntu-latest

    steps:
      - name: Post Welcome Comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const issueNumber = context.payload.issue.number;

            const message = `👋 Hey @${author}!

            Thanks for opening issue #${issueNumber in context.issue}!

            Our maintainer will review it shortly and get back to you.

            While you wait:

            - 📖 Check our [Contributing Guide](https://github.com/AditthyaSS/iloveAgents/blob/main/CONTRIBUTING.md).
            - 💬 Feel free to add more details to help us understand the issue better.

            **Support ILoveAgents ❤️**

            This project is completely free and community-driven. If ILoveAgents has been useful to you, the best way to support us is to [⭐ star the repository](https://github.com/AditthyaSS/iloveAgents).

            Every star helps others discover the project and keeps our community growing. 🙏

            Happy contributing!

            — [@AditthyaSS](https://github.com/AditthyaSS)`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });

