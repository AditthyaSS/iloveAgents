
name: Welcome New Issue Author

# Trigger when a new issue is opened
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  welcome:
    name: Welcome New Contributor
    runs-on: ubuntu-latest

    steps:
      - name: Post Welcome Comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const issueAuthor = context.payload.issue.user.login;

            const message = `
            👋 Hey @${issueAuthor}!

            Welcome to **ILoveAgents**! 🚀

            Thank you for opening issue #${issueNumber}.

            We appreciate your interest in improving our project.

            Our team will review your issue and get back to you as soon as possible.

            Before contributing, please:
            - Check whether a similar issue already exists.
            - Provide clear details and steps to reproduce bugs.
            - Share relevant screenshots or error messages if possible.
            - Follow our contribution guidelines.

            Thank you for being part of the ILoveAgents community! ❤️

            Happy contributing! 🎉
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });

