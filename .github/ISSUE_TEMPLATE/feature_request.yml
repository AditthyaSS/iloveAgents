name: Feature Request
description: Suggest a new feature, improvement, or enhancement to the iloveAgents platform
title: "[Feature]: "
labels: ["OSIC'26"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make iloveAgents better? We'd love to hear it!
        If you want to suggest a new agent, please use the New Agent Proposal template instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point, friction, or limitation you are currently facing.
      placeholder: Right now there is no convenient way to copy the output as plain text...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe your proposed feature or enhancement clearly.
      placeholder: Add a "Copy as plain text" button next to the existing markdown copy action.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Any other solutions or workarounds you considered? (optional)
      description: Let us know if you thought of alternative ways to solve this problem.
      placeholder: I also considered adding a global toggle in settings, but an inline button is faster...

  - type: dropdown
    id: area
    attributes:
      label: Which part of the platform is this about?
      description: Select the primary module or feature area affected.
      options:
        - Agent Runner
        - Homepage / Agent Grid
        - API Key / Provider Bar
        - Output Panel
        - Sidebar / Navigation
        - Mobile Experience
        - Performance
        - Other
    validations:
      required: true

  - type: input
    id: other_area
    attributes:
      label: If you selected "Other", please specify the component or area (optional)
      description: Help us pinpoint the exact part of the application.
      placeholder: e.g. Batch mode runner, CSV parser, export utilities...
