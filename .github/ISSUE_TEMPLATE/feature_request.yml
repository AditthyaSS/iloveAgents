name: Feature Request
description: Propose a new feature or enhancement for iloveAgents.
title: "[Feature]: "
labels: ["enhancement", "OSIC'26"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Provide a clear and concise description of what you want to happen.
      placeholder: Describe the feature, problem it solves, and expected behavior...
    validations:
      required: true
  - type: input
    id: other_areas
    attributes:
      label: Other Application Areas (Optional)
      description: Specify any other modules, agents, or workflows impacted by this feature.
      placeholder: e.g., Agent Registry, CLI, Cost Estimator
    validations:
      required: false
