name: 🐞 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels:
  - bug
  - "OSIC'26"

body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Bug Report

        Thank you for taking the time to report this issue!

        Please complete the form below with as much detail as possible. This helps us reproduce, investigate, and fix the bug faster.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
      placeholder: |
        Example:
        Clicking the "Run" button on the Code Reviewer agent does nothing.
        No output or error message is displayed.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. Open the Code Reviewer agent
        2. Paste any source code
        3. Click the "Run" button
        4. Observe that nothing happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: |
        The code should execute successfully and display the review in the output panel.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: |
        The Run button becomes inactive and no output or error is shown.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious is this issue?
      options:
        - Critical (Application unusable)
        - High (Major functionality broken)
        - Medium (Feature partially affected)
        - Low (Minor issue or UI problem)
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: AI Provider
      description: Which provider were you using?
      options:
        - OpenAI
        - Anthropic
        - Google Gemini
        - Ollama
        - Azure OpenAI
        - Other
        - Not Applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application Version
      description: Enter the version if known.
      placeholder: v1.0.0

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Google Chrome 139.0.0

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11 / Ubuntu 24.04 / macOS Sonoma

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Console Output
      description: Paste any error messages, stack traces, or browser console logs.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots or GIFs here to help explain the issue.

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Include any other details that may help us investigate.
      placeholder: |
        - Does the issue happen every time?
        - Did it work previously?
        - Any recent configuration changes?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before creating this report.
          required: true
        - label: I can consistently reproduce this issue.
        - label: I have included all relevant logs, screenshots, and details.
