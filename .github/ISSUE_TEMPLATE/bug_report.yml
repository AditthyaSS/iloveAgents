
    
name: Bug Report
description: Report a bug or something that is not working correctly
title: "[Bug]: "
labels:
  - "OSIC'26"

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide the details below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Describe the problem you experienced.
      placeholder: "When I click Run on the Code Reviewer agent, nothing happens."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How do I reproduce it?
      description: List the steps to reproduce the issue.
      placeholder: |
        1. Open the Code Reviewer agent.
        2. Paste some code.
        3. Click Run.
        4. Nothing happens.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "I expected the output to appear in the output panel."
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Which provider were you using?
      options:
        - OpenAI
        - Anthropic
        - Google Gemini
        - Not applicable
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome on Windows 11"
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Screenshots or error messages
      description: Add any screenshots or error messages (optional).
      placeholder: "Paste error messages or describe attached screenshots."
    validations:
      required: false
