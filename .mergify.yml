
# ============================================================
# iloveAgents — Mergify Automation
# Automated PR management, contributor experience and CI safety
# ============================================================

pull_request_rules:

  # ----------------------------------------------------------
  # 1. Thank contributors after successful merge
  # ----------------------------------------------------------
  - name: Thank contributor on merge
    conditions:
      - merged
    actions:
      comment:
        message: |
          🎉 Your contribution has been successfully merged into iloveAgents!

          Thank you for taking the time to contribute. Every contribution makes this project better for everyone.

          ⭐ If you haven't already, consider starring the repository:
          https://github.com/AditthyaSS/iloveAgents

          We hope to see you contributing again soon. You're always welcome here! 🙌

          — @AditthyaSS

  # ----------------------------------------------------------
  # 2. Welcome first-time contributors
  # Requires the first-time-contributor label to be applied.
  # ----------------------------------------------------------
  - name: Welcome first-time contributor
    conditions:
      - author != AditthyaSS
      - label = first-time-contributor
      - -draft
      - -closed
    actions:
      comment:
        message: |
          Hey @{{author}}! 👋

          Welcome to your first contribution to iloveAgents! 🎊

          We're excited to have you as part of our open-source community.

          While you wait for the review:

          - ⭐ Star the repository: https://github.com/AditthyaSS/iloveAgents
          - 📖 Read our contributing guide:
            https://github.com/AditthyaSS/iloveAgents/blob/main/CONTRIBUTING.md
          - 💬 Let us know if you need help.

          Thank you for helping us build something useful for everyone!

          Welcome to the iloveAgents family. 🚀

          — @AditthyaSS

  # ----------------------------------------------------------
  # 3. Auto-merge approved PRs
  # Vercel preview is intentionally not a required check.
  # GitHub branch protection and Mergify protections still apply.
  # ----------------------------------------------------------
  - name: Auto merge when approved
    conditions:
      - base = main
      - "#approved-reviews-by >= 1"
      - check-success = Summary
      - -draft
      - -closed
      - -merged
      - -conflict
    actions:
      merge:
        method: merge

  # ----------------------------------------------------------
  # 4. Notify contributors about merge conflicts
  # ----------------------------------------------------------
  - name: Notify author on merge conflict
    conditions:
      - conflict
      - -draft
      - -closed
      - -merged
    actions:
      comment:
        message: |
          ⚠️ Hey @{{author}}!

          Your PR currently has merge conflicts with the main branch.

          Please synchronize your branch with the latest main and resolve the conflicts.

          Helpful guide:
          https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/resolving-a-merge-conflict-using-the-command-line

          Let us know if you need help!

          — @AditthyaSS

  # ----------------------------------------------------------
  # 5. Flag package-lock.json changes without package.json
  # ----------------------------------------------------------
  - name: Flag package-lock changed without package.json
    conditions:
      - 'files ~= ^package-lock\.json$'
      - '-files ~= ^package\.json$'
      - -closed
    actions:
      comment:
        message: |
          Hey @{{author}}! 👋

          It looks like package-lock.json changed without package.json.

          If this was unintentional, please restore the lockfile:

          ```bash
          git checkout -- package-lock.json
          ```

          Then commit and push your changes again.

          If this change was intentional, please explain why in your PR.

          — @AditthyaSS
      label:
        add:
          - needs-fix

  # ----------------------------------------------------------
  # 6. Flag package.json changes without package-lock.json
  # ----------------------------------------------------------
  - name: Flag package.json changed without package-lock
    conditions:
      - 'files ~= ^package\.json$'
      - '-files ~= ^package-lock\.json$'
      - -closed
    actions:
      comment:
        message: |
          Hey @{{author}}! 👋

          package.json was modified, but package-lock.json was not updated.

          If you added or removed a dependency, run:

          ```bash
          npm install
          ```

          Commit both files together.

          If you only changed scripts, metadata or other non-dependency fields, you can ignore this notification.

          Thank you! 🙏

          — @AditthyaSS
      label:
        add:
          - needs-fix

  # ----------------------------------------------------------
  # 7. Validate PR title convention
  # ----------------------------------------------------------
  - name: Flag invalid PR title format
    conditions:
      - '-title ~= ^(feat|fix|docs|style|refactor|test|chore)(\([^)]+\))?!?:\s.+$'
      - -draft
      - -closed
    actions:
      comment:
        message: |
          Hey @{{author}}! 👋

          Your PR title doesn't follow our required convention.

          Please use:

          `type: short description`

          Accepted types:
          - feat
          - fix
          - docs
          - style
          - refactor
          - test
          - chore

          Examples:
          - feat: add a new AI agent
          - fix: resolve registry import error
          - docs: improve contribution guide
          - chore: update dependencies

          Thank you!

          — @AditthyaSS
      label:
        add:
          - needs-fix

  # ----------------------------------------------------------
  # 8. Flag empty PR descriptions
  # ----------------------------------------------------------
  - name: Flag empty PR description
    conditions:
      - 'body ~= ^\s*$'
      - -draft
      - -closed
    actions:
      comment:
        message: |
          Hey @{{author}}! 👋

          Your PR description appears to be empty.

          Please include:

          - What changes you made.
          - Why these changes are needed.
          - The related issue, if applicable.
          - Screenshots for UI changes.
          - Confirmation that npm run build passes.

          A clear description helps us review your contribution faster! 🚀

          — @AditthyaSS
      label:
        add:
          - needs-fix

  # ----------------------------------------------------------
  # 9. Flag missing linked issues
  # ----------------------------------------------------------
  - name: Flag missing linked issue
    conditions:
      - '-body ~= (?i)(closes?|fixes?|resolves?)\s+#[0-9]+'
      - 'body ~= .{20,}'
      - -draft
      - -closed
    actions:
      comment:
        message: |
          Hey @{{author}}! 👋

          Your PR doesn't appear to reference a related issue.

          If this PR addresses an existing issue, add:

          `Closes #issue_number`

          Replace issue_number with the actual issue number.

          If this is an independent contribution, briefly explain that in your PR description.

          Thank you! 🔗

          — @AditthyaSS
      label:
        add:
          - needs-fix

  # ----------------------------------------------------------
  # 10. Auto-merge Dependabot patch updates
  # ----------------------------------------------------------
  - name: Auto-merge Dependabot patch updates
    conditions:
      - author = dependabot[bot]
      - dependabot-update-type = version-update:semver-patch
      - check-success = build
      - -draft
      - -conflict
    actions:
      merge:
        method: squash

  # ----------------------------------------------------------
  # 11. Notify contributors when build fails
  # ----------------------------------------------------------
  - name: Notify when build fails
    conditions:
      - check-failure = build
      - -author = dependabot[bot]
      - -draft
      - -closed
    actions:
      comment:
        message: |
          ❌ Hey @{{author}}!

          The build check is failing on your PR.

          Please fix the errors before merging.

          Steps:

          1. Run `npm run build` locally.
          2. Check and fix the reported errors.
          3. Verify the application builds successfully.
          4. Push your changes.

          Common mistake: incorrect agent registry imports.

          Avoid:
          ```js
          import agents from '../agents/registry'
          ```

          Use:
          ```js
          import { useAgents } from '../lib/useAgents'
          const { agents } = useAgents()
          ```

          See CONTRIBUTING.md for more information.

          — @AditthyaSS
      label:
        add:
          - needs-fix

  # ----------------------------------------------------------
  # 12. Warn about outdated branches
  # ----------------------------------------------------------
  - name: Warn when branch is behind main
    conditions:
      - base = main
      - '#commits-behind > 0'
      - -draft
      - -closed
      - -merged
    actions:
      comment:
        message: |
          ⚠️ Hey @{{author}}!

          Your branch is behind the latest main branch.

          Please update your branch before merging to reduce the chance of conflicts.

          You can use GitHub's Update branch option or run:

          ```bash
          git fetch origin
          git merge origin/main
          ```

          Resolve any conflicts, then push your changes.

          — @AditthyaSS


# ============================================================
# MERGIFY MERGE PROTECTION REPORTING
# ============================================================

merge_protections_settings:
  reporting_method: check-runs
